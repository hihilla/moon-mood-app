name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-and-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm config set registry https://registry.npmjs.org/
      - run: npm ci --registry=https://registry.npmjs.org/
      - run: npm test -- --ci

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm config set registry https://registry.npmjs.org/
      - run: npm ci --registry=https://registry.npmjs.org/
      - run: npx playwright install --with-deps chromium --registry=https://registry.npmjs.org/
      - run: npm run test:e2e
        env:
          CI: true
